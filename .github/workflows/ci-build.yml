name: CI - Build

on:
  workflow_run:
    workflows: ["CI - Verify"]
    types: [completed]

env:
  REGISTRY: docker.io
  DOCKERHUB_ORG: omerbarzolay16
  CHART_DIR: microapp-iac/helm/microapp
  API_DIR: services/api
  WEB_DIR: services/web

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Build images (no push)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, web]
    steps:
      - name: Checkout at triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set IMAGE_TAG from head_sha
        run: echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha }}" | cut -c1-7 >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} (test build only)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service == 'api' && env.API_DIR || env.WEB_DIR }}
          file: ${{ matrix.service == 'api' && format('{0}/Dockerfile', env.API_DIR) || format('{0}/Dockerfile', env.WEB_DIR) }}
          push: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.DOCKERHUB_ORG }}/microapp-${{ matrix.service }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
