name: CI - Verify

on:
  # Manual run + all pushes + all PRs
  workflow_dispatch:
  push: { branches: ["**"] }
  pull_request: { branches: ["**"] }

env:
  # Repo-relative paths (what exists after actions/checkout)
  CHART_DIR: microapp-iac/helm/microapp
  API_DIR: microapp-k8s/services/api
  WEB_DIR: microapp-k8s/services/web

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # 1) Get the repository at the triggering revision
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Derive a consistent immutable image tag (short SHA) for this run
      - name: Set IMAGE_TAG (short SHA)
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # 3) Fail fast if expected paths (and Dockerfiles) are missing
      - name: Preflight – required paths exist
        run: |
          set -e
          test -d "$API_DIR" || { echo "::error::Missing $API_DIR"; exit 1; }
          test -d "$WEB_DIR"  || { echo "::error::Missing $WEB_DIR"; exit 1; }
          test -f "$API_DIR/Dockerfile" || { echo "::error::Missing $API_DIR/Dockerfile"; exit 1; }
          test -f "$WEB_DIR/Dockerfile"  || { echo "::error::Missing $WEB_DIR/Dockerfile"; exit 1; }

      # 4) Python lint for the API service
      - name: Python lint (ruff) for API
        uses: chartboost/ruff-action@v1
        with:
          src: ${{ env.API_DIR }}

      # 5) Dockerfile lint (API) – fail only on errors, warnings shown in logs
      - name: Dockerfile lint (api)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ env.API_DIR }}/Dockerfile
          failure-threshold: error

      # 6) Dockerfile lint (WEB)
      - name: Dockerfile lint (web)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ env.WEB_DIR }}/Dockerfile
          failure-threshold: error

      # 7) Helm lint & render to catch chart issues early
      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: |
          helm lint "${{ env.CHART_DIR }}"
          helm template test "${{ env.CHART_DIR }}" \
            --set ingress.host="ci.local" \
            --set api.image.repository="example/api" \
            --set web.image.repository="example/web" \
            --set db.password="dummy"
