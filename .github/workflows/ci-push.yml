name: CI - Push

on:
  workflow_run:
    workflows: ["CI - Scan"]
    types: [completed]

jobs:
  push:
    # Only if Scan succeeded AND the original event wasn’t a PR
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: microapp-k8s/services/api
            dockerfile: microapp-k8s/services/api/Dockerfile
          - service: web
            context: microapp-k8s/services/web
            dockerfile: microapp-k8s/services/web/Dockerfile

    steps:
      # 1) Checkout the same commit
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # 2) Same tag again
      - name: Set IMAGE_TAG from head_sha
        run: echo "IMAGE_TAG=$(echo '${{ github.event.workflow_run.head_sha }}' | cut -c1-7)" >> "$GITHUB_ENV"

      # 3) Authenticate to Docker Hub (needs repo secrets set)
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # 4) Build & push immutable tag; also push :latest on main
      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            docker.io/omerbarzolay16/microapp-${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ github.event.workflow_run.head_branch == 'main' && format('docker.io/omerbarzolay16/microapp-{0}:latest', matrix.service) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
