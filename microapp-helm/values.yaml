imagePullSecrets: []

api:
  replicaCount: 1
  image:
    repository: omerbarzolay16/microapp-api
    tag: "0.1"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  readinessProbe:
    path: /api/health
    initialDelaySeconds: 5
    periodSeconds: 5
  env:
    dbHost: db
    dbPort: "5432"
    dbName: microapp
    dbUser: microuser

web:
  replicaCount: 1
  image:
    repository: omerbarzolay16/microapp-web
    tag: "0.1"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

db:
  image: postgres:16
  service:
    port: 5432
  username: microuser
  password: micropass
  database: microapp
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""  # use default when empty
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 5

ingress:
  enabled: true
  className: nginx
  annotations: {}
  host: microapp.local
  tls: []