<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MicroApp (K8s)</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>MicroApp (K8s)</h1>
      <p class="muted">Web + API + Postgres on Kubernetes</p>

      <section class="card">
        <h2>Health</h2>
        <button id="check">Check Backend Health</button>
        <pre id="health"></pre>
      </section>

      <section class="card">
        <h2>Todos</h2>
        <form id="add-form">
          <input id="title" placeholder="New todo title..." />
          <button type="submit">Add</button>
        </form>
        <ul id="list"></ul>
      </section>

      <footer class="muted small">K8s: Ingress → Service → Pod → Postgres</footer>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
